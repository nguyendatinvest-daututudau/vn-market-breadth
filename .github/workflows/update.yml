name: Update market breadth data

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'docs/**'
      - 'tests/**'
      - '.github/**'
  schedule:
    # 08:10 UTC = 15:10 gio VN (sau gio dong cua)
    - cron: "10 8 * * 1-5"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Manual mode: previous close is safe before 15:10; current session may contain intraday data"
        required: true
        default: latest_completed_close
        type: choice
        options:
          - latest_completed_close
          - current_session

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check frontend not reverted
        run: python scripts/check_frontend.py

      - name: Run tests
        run: python -m pytest

      - name: Restore OHLC cache
        uses: actions/cache@v4
        with:
          path: data/ohlc_cache
          key: ohlc-cache-v2-${{ hashFiles('scripts/**/*.py', 'scripts/requirements.txt') }}-${{ github.run_id }}
          restore-keys: |
            ohlc-cache-v2-${{ hashFiles('scripts/**/*.py', 'scripts/requirements.txt') }}-
            ohlc-cache-v2-

      - name: Validate SSI secrets
        run: |
          test -n "$SSI_CLIENT_ID"
          test -n "$SSI_API_KEY"
          test -n "$SSI_API_SECRET"
        env:
          SSI_CLIENT_ID: ${{ secrets.SSI_CLIENT_ID }}
          SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
          SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}

      - name: Restore FastConnect token cache (optional, cho CI khong can OTP)
        run: |
          if [ -n "$SSI_TOKEN_CACHE" ]; then
            echo "$SSI_TOKEN_CACHE" | base64 -d > scripts/token_cache.json
            echo "Token cache restored."
          else
            echo "SSI_TOKEN_CACHE chua duoc dat — thu authenticate() khong OTP."
          fi
        env:
          SSI_TOKEN_CACHE: ${{ secrets.SSI_TOKEN_CACHE }}

      - name: Run fetch + compute
        run: python scripts/fetch_and_compute.py
        env:
          SSI_CLIENT_ID: ${{ secrets.SSI_CLIENT_ID }}
          SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
          SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
          PIPELINE_RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode || 'scheduled_close' }}

      - name: Generate dashboard.html (embedded data)
        run: python scripts/embed_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update market breadth data $(date -u +'%Y-%m-%d')"
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "Pushed on attempt $attempt."
                exit 0
              fi
              echo "Push attempt $attempt rejected; rebasing..."
              git pull --rebase --autostash
            done
            echo "Push failed after 5 attempts."
            exit 1
          fi
