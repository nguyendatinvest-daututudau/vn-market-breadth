name: Evaluate filter logic

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evaluate-filters
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Restore OHLC cache
        uses: actions/cache@v4
        with:
          path: data/ohlc_cache
          key: evaluate-ohlc-cache-v1-${{ hashFiles('scripts/**/*.py') }}
          restore-keys: |
            evaluate-ohlc-cache-v1-
            ohlc-cache-v2-

      - name: Validate SSI secrets
        run: |
          test -n "$SSI_CLIENT_ID"
          test -n "$SSI_API_KEY"
          test -n "$SSI_API_SECRET"
        env:
          SSI_CLIENT_ID: ${{ secrets.SSI_CLIENT_ID }}
          SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
          SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}

      - name: Restore FastConnect token cache (optional, cho CI khong can OTP)
        run: |
          if [ -n "$SSI_TOKEN_CACHE" ]; then
            echo "$SSI_TOKEN_CACHE" | base64 -d > scripts/token_cache.json
            echo "Token cache restored."
          else
            echo "SSI_TOKEN_CACHE chua duoc dat — thu authenticate() khong OTP."
          fi
        env:
          SSI_TOKEN_CACHE: ${{ secrets.SSI_TOKEN_CACHE }}

      - name: Backfill full OHLC history (2015 -> now)
        run: python scripts/backfill_history.py
        env:
          SSI_CLIENT_ID: ${{ secrets.SSI_CLIENT_ID }}
          SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
          SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}

      - name: Run filter evaluation
        run: python scripts/evaluate_filters.py

      - name: Commit evaluation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No evaluation changes to commit."
            exit 0
          fi
          git commit -m "chore: update filter evaluation results $(date -u +'%Y-%m-%d')"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt rejected; rebasing..."
            git pull --rebase
          done
          echo "Push failed after 5 attempts."
          exit 1