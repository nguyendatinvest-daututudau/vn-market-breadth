name: Evaluate filter logic

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evaluate-filters
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Restore OHLC cache
        uses: actions/cache@v4
        with:
          path: data/ohlc_cache
          key: ohlc-cache-v2-${{ hashFiles('scripts/**/*.py', '.github/workflows/update.yml') }}
          restore-keys: |
            ohlc-cache-v2-

      - name: Run filter evaluation
        run: python scripts/evaluate_filters.py

      - name: Commit evaluation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/evaluation_filters.json docs/data/evaluation_filters.json
          if git diff --cached --quiet; then
            echo "No evaluation changes to commit."
          else
            git commit -m "chore: update filter evaluation results $(date -u +'%Y-%m-%d')"
            git push
          fi